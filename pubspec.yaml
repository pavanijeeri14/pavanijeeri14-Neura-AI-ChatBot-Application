name: llama_bot
description: "An Android Application of AI ChatBot integrated with Open API keys"

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.6.0


dependencies:
  flutter:
    sdk: flutter

  # firebase_core: ^2.32.0  # Required for Firebase
  # firebase_auth: ^4.16.0  # For authentication
  # cloud_firestore: ^4.17.5  # For database storage
  provider: ^6.1.2  # For state management
  lottie: ^2.6.0  # For animations
  firebase_database: ^10.5.7
  cupertino_icons: ^1.0.8
  translator: ^1.0.3+1
  flutter_typeahead: ^5.2.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  google_ml_kit: ^0.19.0
  google_mlkit_text_recognition: ^0.14.0
  file_picker: ^9.0.3
  pdfx: ^2.8.0
  clipboard: ^0.1.3
  syncfusion_flutter_pdf: ^28.2.11
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  toast: ^0.3.0
  fluttertoast: ^8.2.12
  google_sign_in: ^6.2.2
  firebase_core: ^2.32.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.6.5
  firebase_messaging: ^14.7.10
  firebase_app_check: ^0.2.2 
  http: ^1.3.0

  #pdf_text: ^0.3.0
  #image_downloader: ^0.31.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

#for app icon
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png" 
  adaptive_icon_background: "#ffffff" 


  flutter_lints: ^5.0.0

flutter:


  uses-material-design: true


  assets:
    - assets\images\llama.png
    - assets\images\ai.png
    - assets\lottie\llama.json
    - assets\lottie\animate1.json
    - assets\lottie\animate2.json
    - assets\images\Google.png
    - assets\images\sign.png
    - assets\images\background.jpg
    - assets\images\logo.png
    - assets/lottie/

